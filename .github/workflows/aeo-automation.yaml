name: Daily AEO Pipeline Automation

on:
  schedule:
    # UTC 기준 밤 11시 = 한국 시간(KST) 매일 오전 8시
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub 웹 상에서 수동으로 즉시 실행 테스트를 할 수 있도록 허용

jobs:
  run-aeo-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth gspread google-genai pandas pillow

      - name: Step 1. Run Trend Topic Curator
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python scripts/curator.py

      - name: Step 2. Run AEO Daily Docs Publisher
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python scripts/publisher.py

      - name: Step 3. Run AEO Thumbnail Generator
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python scripts/thumbnail.py

      - name: Step 4. Commit and Push Generated Content to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbnails/ docs/
          git commit -m "Auto-generated blog content for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push